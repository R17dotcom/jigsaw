<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Put it together ✨</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#f6f2ed;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center}
main{width:min(96vw,1120px);padding:24px 12px}h1{text-align:center;font-size:clamp(28px,5vw,42px);letter-spacing:-.035em;margin:0 0 22px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 248px;gap:16px;align-items:start}
.panel{background:#201f1e;border:1px solid #34312f;border-radius:17px;padding:10px;box-shadow:0 15px 45px #0007}
.board{position:relative;width:100%;aspect-ratio:1000/695;overflow:hidden;border-radius:10px;background:#171615;isolation:isolate;touch-action:none}
.outlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .55s ease}
.final-image{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;opacity:0;z-index:8;pointer-events:none;transition:opacity .75s cubic-bezier(.2,.7,.2,1)}
.tray-title{text-align:center;font-size:12px;letter-spacing:.12em;font-weight:800;color:#c4bfba;margin:5px 0 13px}
.tray{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;align-content:start}
.piece{position:relative;width:100%;aspect-ratio:1.12;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 4px 4px #0008)}
.piece svg{width:100%;height:100%;display:block;overflow:visible}
.piece.dragging{position:fixed!important;width:min(15vw,140px)!important;height:auto!important;aspect-ratio:1.12!important;z-index:99999!important;pointer-events:none;filter:drop-shadow(0 14px 12px #000b)}
.piece.locked{position:absolute;aspect-ratio:auto;cursor:default;filter:drop-shadow(0 1px 1px #0006);transition:opacity .55s ease}
.piece.shake{animation:shake .25s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
button{display:block;margin:13px auto 0;border:0;border-radius:999px;padding:11px 19px;font-weight:750;cursor:pointer;background:#f4f1ec;color:#181615;transition:transform .15s,background .15s}
button:hover{transform:translateY(-1px);background:white}.status{text-align:center;font-weight:750;margin:17px 0 0;min-height:24px;color:#eee}
.sweep{position:absolute;top:-30%;bottom:-30%;left:-55%;width:35%;opacity:0;z-index:10;pointer-events:none;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,#fff7,#fff,transparent)}
.board.complete{animation:glow 1.5s ease-out 2s forwards}.board.complete .sweep{animation:sweep 1.15s ease-out 2s forwards}
.board.complete .outlines{opacity:0;transition-delay:2s}.board.complete .piece.locked{opacity:0;transition-delay:2s}.board.complete .final-image{opacity:1;transition-delay:2s}
@keyframes glow{0%{filter:brightness(1)}38%{filter:brightness(1.45) drop-shadow(0 0 12px #fff4b8)}60%{filter:brightness(1.8) drop-shadow(0 0 24px #fff0b0)}100%{filter:brightness(1.08) drop-shadow(0 0 8px #ffe7a044}}
@keyframes sweep{0%{left:-55%;opacity:0}18%{opacity:.95}100%{left:130%;opacity:0}}
@media(max-width:700px){.layout{grid-template-columns:1fr}.tray{grid-template-columns:repeat(5,minmax(0,1fr))}.piece.dragging{width:min(24vw,125px)!important}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head><body><main>
<h1>Put it together. ✨</h1>
<div class="layout">
<section class="panel"><div class="board" id="board">
<svg class="outlines" id="outlines" viewBox="0 0 1000 695" preserveAspectRatio="none"></svg>

<div class="sweep"></div>
</div></section>

 // Ends and tangent are flat, so it joins the straight edge cleanly.
